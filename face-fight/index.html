const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=960,H=540,GROUND=455;
const img1=new Image();img1.src=F1;const img2=new Image();img2.src=F2;

const CHARS=[
  {name:'정장맨',sub:'면접 합격의 기운',img:img1,body:'suit',spName:'이력서 폭탄',spColor:'#fff',speed:5.2,power:1.0},
  {name:'생얼맨',sub:'방금 일어남',img:img2,body:'bare',spName:'베개 투척',spColor:'#c9d8ff',speed:4.6,power:1.15},
];

// ---------- sound ----------
let ac=null;
function snd(f,d=0.08,type='square',v=0.15,slide=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

// ---------- input ----------
const keys={};const pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',
  ArrowDown:'guard',KeyS:'guard',KeyJ:'punch',KeyZ:'punch',KeyK:'kick',KeyX:'kick',KeyL:'special',KeyC:'special',Enter:'start'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
});
function canvasPt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{const p=canvasPt(e);clickAt(p.x,p.y);});

// ---------- fighters ----------
function Fighter(ci,x,face,isCpu){
  return {c:CHARS[ci],x,y:GROUND,vx:0,vy:0,face,hp:100,shown:100,gauge:0,cpu:isCpu,
    state:'idle',t:0,hitstun:0,atk:null,hitDone:false,flash:0,wob:0,walk:0,ai:{think:0,plan:null}};
}
const MOVES={
  punch:{startup:5,active:5,recover:9,range:78,dmg:7,kb:5,gauge:9},
  kick:{startup:10,active:6,recover:15,range:100,dmg:12,kb:9,gauge:13},
};
let P,E,projs=[],parts=[],texts=[],shake=0,scene='select',sel=0,round=1,wins=[0,0],timer=60,tick=0,banner=null,slow=0;

function startMatch(ci){sel=ci;wins=[0,0];round=1;startRound();}
function startRound(){
  P=Fighter(sel,260,1,false);E=Fighter(1-sel,700,-1,true);
  projs=[];parts=[];texts=[];timer=60;tick=0;scene='fight';
  banner={t:0,lines:['ROUND '+round,'싸워라!']};
}

function control(f,inp){
  if(f.hitstun>0||f.state==='ko'||f.state==='win')return;
  const onGround=f.y>=GROUND;
  if(f.atk){return;}
  f.state='idle';
  if(inp.guard&&onGround){f.state='guard';f.vx=0;return;}
  let mv=(inp.right?1:0)-(inp.left?1:0);
  f.vx=mv*f.c.speed;if(mv)f.walk+=0.25;
  if(inp.up&&onGround){f.vy=-15;snd(300,0.12,'triangle',0.1,300);}
  if(inp.punch)beginAtk(f,'punch');
  else if(inp.kick)beginAtk(f,'kick');
  else if(inp.special&&f.gauge>=100){f.gauge=0;f.atk={kind:'special',t:0};f.vx=0;
    say(f.x,f.y-190,f.c.spName+'!','#f2c14e',26);snd(200,0.4,'sawtooth',0.15,600);}
}
function beginAtk(f,kind){f.atk={kind,t:0};f.hitDone=false;if(f.y>=GROUND)f.vx*=0.3;snd(kind==='punch'?520:380,0.05,'square',0.06);}

function update(f,o){
  // face opponent
  if(!f.atk&&f.hitstun<=0&&f.state!=='ko')f.face=o.x>f.x?1:-1;
  f.vy+=0.8;f.x+=f.vx;f.y+=f.vy;
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;if(f.hitstun>0||f.state==='ko')f.vx*=0.82;}
  f.x=Math.max(50,Math.min(W-50,f.x));
  // push apart
  const dx=o.x-f.x;if(Math.abs(dx)<60&&Math.abs(o.y-f.y)<80){const p=(60-Math.abs(dx))/2*Math.sign(dx||1);f.x-=p;}
  if(f.hitstun>0)f.hitstun--;
  if(f.flash>0)f.flash--;f.wob*=0.85;
  f.shown+=(f.hp-f.shown)*0.08;
  if(f.atk){
    const a=f.atk;a.t++;
    if(a.kind==='special'){
      if(a.t===14){projs.push({x:f.x+f.face*50,y:f.y-110,vx:f.face*11,owner:f,c:f.c,rot:0,life:110});}
      if(a.t>30)f.atk=null;
    }else{
      const m=MOVES[a.kind];
      if(a.t>=m.startup&&a.t<m.startup+m.active&&!f.hitDone){
        const dist=(o.x-f.x)*f.face;
        if(dist>0&&dist<m.range&&Math.abs(o.y-f.y)<110&&o.state!=='ko'){f.hitDone=true;hit(f,o,m.dmg*f.c.power,m.kb,m.gauge,a.kind);}
      }
      if(a.t>=m.startup+m.active+m.recover)f.atk=null;
    }
  }
}
function hit(a,d,dmg,kb,g,kind){
  if(P.state==='ko'||E.state==='ko')return;
  const guarding=d.state==='guard'&&d.face===-a.face*1&&!d.atk;
  if(guarding){dmg*=0.15;kb*=0.5;snd(900,0.05,'square',0.06);burst(d.x-a.face*10,d.y-110,'#9cf',6);}
  else{
    d.hitstun=kind==='special'?32:16;d.flash=8;d.wob=1;d.atk=null;
    snd(kind==='kick'?110:160,0.12,'sawtooth',0.18,-60);shake=kind==='special'?16:(kind==='kick'?9:5);
    burst(d.x-a.face*10,d.y-120,'#ffd34d',kind==='special'?24:10);
    say(d.x,d.y-200,Math.round(dmg),'#fff',kind==='special'?36:24);
  }
  d.hp=Math.max(0,d.hp-dmg);d.vx=a.face*kb;if(!guarding&&kind!=='punch')d.vy=-5;
  a.gauge=Math.min(100,a.gauge+g);d.gauge=Math.min(100,d.gauge+g*0.5);
  if(d.hp<=0)ko(a,d);
}
function ko(w,l){l.state='ko';l.vy=-12;l.vx=w.face*9;w.state='win';slow=60;shake=22;
  snd(80,0.6,'sawtooth',0.2,-40);
  const wi=w===P?0:1;wins[wi]++;
  banner={t:0,lines:['K.O.!',w.c.name+' 승리'],end:true};}

function cpuThink(f,o){
  const inp={};const ai=f.ai;const dist=Math.abs(o.x-f.x);const dir=o.x>f.x?'right':'left',back=o.x>f.x?'left':'right';
  if(--ai.think<=0){
    ai.think=8+Math.random()*14;
    const r=Math.random();
    if(f.gauge>=100&&dist>200&&r<0.5)ai.plan='special';
    else if(o.atk&&dist<120&&r<0.45)ai.plan='guard';
    else if(dist>110)ai.plan=r<0.12?'jumpin':'approach';
    else ai.plan=r<0.45?'punch':r<0.75?'kick':r<0.87?'retreat':'guard';
  }
  switch(ai.plan){
    case 'approach':inp[dir]=1;break;
    case 'jumpin':inp[dir]=1;inp.up=1;ai.plan='approach';break;
    case 'retreat':inp[back]=1;break;
    case 'guard':inp.guard=1;break;
    case 'punch':inp.punch=1;ai.plan='wait';break;
    case 'kick':inp.kick=1;ai.plan='wait';break;
    case 'special':inp.special=1;ai.plan='wait';break;
  }
  return inp;
}

function updProj(){
  for(const p of projs){p.x+=p.vx;p.rot+=0.3;p.life--;
    const o=p.owner===P?E:P;
    if(Math.abs(p.x-o.x)<45&&Math.abs(p.y-(o.y-100))<90&&o.state!=='ko'){p.life=0;hit(p.owner,o,22*p.owner.c.power,13,0,'special');}
    if(Math.random()<0.5)parts.push({x:p.x,y:p.y,vx:-p.vx*0.1,vy:(Math.random()-.5)*2,l:20,c:'#f2c14e'});
  }
  projs=projs.filter(p=>p.life>0&&p.x>-50&&p.x<W+50);
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:18+Math.random()*12,c});}}
function say(x,y,s,c,sz){texts.push({x,y,s:String(s),c,sz,l:50});}

// ---------- drawing ----------
function drawFighter(f){
  const c=f.c;ctx.save();ctx.translate(f.x,f.y);
  if(f.state==='ko'&&f.y>=GROUND){ctx.rotate(-f.face*Math.PI/2*Math.min(1,(f.koT=(f.koT||0)+0.08)));}
  ctx.scale(f.face,1);
  const a=f.atk,m=a&&MOVES[a.kind];
  const ext=a?(a.kind==='special'?Math.min(1,a.t/14):(a.t<m.startup?0.2:a.t<m.startup+m.active?1:0.4)):0;
  const walk=Math.sin(f.walk)*(Math.abs(f.vx)>0.5&&f.y>=GROUND?1:0);
  const crouch=f.state==='guard'?10:0;
  const skin='#f1c7a3',dark=c.body==='suit'?'#1d1d22':'#2b3a55';
  ctx.lineCap='round';ctx.lineJoin='round';
  // legs
  ctx.strokeStyle=dark;ctx.lineWidth=16;
  const hipY=-70+crouch;
  ctx.beginPath();ctx.moveTo(-8,hipY);
  if(a&&a.kind==='kick')ctx.lineTo(-18,0);else ctx.lineTo(-14+walk*14,0);
  ctx.moveTo(8,hipY);
  if(a&&a.kind==='kick')ctx.lineTo(25+ext*65,hipY-ext*25);else ctx.lineTo(14-walk*14,0);
  ctx.stroke();
  // shoes
  ctx.fillStyle='#111';
  // torso
  const tTop=-150+crouch;
  if(c.body==='suit'){
    ctx.fillStyle='#1d1d22';rr(-30,tTop,60,85,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-12,tTop);ctx.lineTo(12,tTop);ctx.lineTo(0,tTop+40);ctx.fill();
    ctx.fillStyle='#24357a';ctx.beginPath();ctx.moveTo(-4,tTop+4);ctx.lineTo(4,tTop+4);ctx.lineTo(6,tTop+45);ctx.lineTo(0,tTop+52);ctx.lineTo(-6,tTop+45);ctx.fill();
    ctx.strokeStyle='#8fb8ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,tTop+14);ctx.lineTo(5,tTop+10);ctx.moveTo(-5,tTop+28);ctx.lineTo(5,tTop+24);ctx.stroke();
  }else{
    ctx.fillStyle=skin;rr(-30,tTop,60,85,14);ctx.fill();
    ctx.strokeStyle='#d9a582';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-14,tTop+28);ctx.quadraticCurveTo(-6,tTop+34,-1,tTop+28);ctx.moveTo(1,tTop+28);ctx.quadraticCurveTo(6,tTop+34,14,tTop+28);ctx.stroke();
    ctx.fillStyle='#2b3a55';rr(-31,tTop+70,62,18,6);ctx.fill();
  }
  // arms
  const armCol=c.body==='suit'?'#1d1d22':skin;
  ctx.strokeStyle=armCol;ctx.lineWidth=13;
  const sy=tTop+14;
  ctx.beginPath();
  if(f.state==='guard'){ctx.moveTo(10,sy);ctx.lineTo(32,sy-10);ctx.lineTo(26,sy-50);}
  else if(a&&(a.kind==='punch'||a.kind==='special')){ctx.moveTo(10,sy);ctx.lineTo(30+ext*55,sy-ext*4);}
  else{ctx.moveTo(10,sy);ctx.lineTo(30,sy+20);ctx.lineTo(36,sy-4);}
  ctx.moveTo(-10,sy);ctx.lineTo(-24+walk*6,sy+28);ctx.lineTo(-10,sy+40);
  ctx.stroke();
  // fist
  ctx.fillStyle=skin;ctx.beginPath();
  if(a&&(a.kind==='punch'||a.kind==='special'))ctx.arc(30+ext*55+6,sy-ext*4,10,0,7);
  else if(f.state==='guard')ctx.arc(26,sy-54,10,0,7);
  else ctx.arc(38,sy-6,9,0,7);
  ctx.fill();
  // head (photo) — big head
  const hw=112,hh=c.img.height/c.img.width*hw;
  const hx=0,hy=tTop-hh/2+10+Math.sin(f.wob*20)*f.wob*6;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(f.wob*0.3*Math.sin(f.wob*25)+(f.hitstun>0?-0.15:0));
  ctx.scale(f.face,1); // keep photo un-mirrored
  ctx.beginPath();ctx.ellipse(0,0,hw/2,hh/2,0,0,7);ctx.closePath();
  ctx.save();ctx.clip();if(c.img.complete)ctx.drawImage(c.img,-hw/2,-hh/2,hw,hh);
  if(f.flash>0){ctx.fillStyle='rgba(255,60,60,.45)';ctx.fillRect(-hw/2,-hh/2,hw,hh);}
  if(f.state==='ko'){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-hw/2,-hh/2,hw,hh);}
  ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.stroke();
  if(f.state==='ko'){ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('✕   ✕',0,-hh*0.08);}
  ctx.restore();
  ctx.restore();
  // shadow
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(f.x,GROUND+4,40*(1-(GROUND-f.y)/400),8,0,0,7);ctx.fill();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}

function drawStage(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2140');g.addColorStop(0.7,'#5a3b5e');g.addColorStop(1,'#2b1e2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // city silhouette
  ctx.fillStyle='#1c1630';
  for(let i=0;i<16;i++){const bw=60,bh=80+((i*73)%120);ctx.fillRect(i*62,GROUND-bh-60,bw,bh+60);}
  ctx.fillStyle='#f2c14e33';for(let i=0;i<40;i++){ctx.fillRect((i*97)%W,GROUND-60-((i*53)%170),6,8);}
  ctx.fillStyle='#3b2a3a';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#51384c';ctx.fillRect(0,GROUND,W,4);
}
function bar(x,y,w,h,v,shown,flip,col){
  ctx.fillStyle='#000a';ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#7a1d1d';
  const sw=w*shown/100,vw=w*v/100;
  if(flip){ctx.fillRect(x+w-sw,y,sw,h);ctx.fillStyle=col;ctx.fillRect(x+w-vw,y,vw,h);}
  else{ctx.fillRect(x,y,sw,h);ctx.fillStyle=col;ctx.fillRect(x,y,vw,h);}
}
function drawHUD(){
  const L=P,R=E;
  bar(30,24,380,22,L.hp,L.shown,true,'#f2c14e');bar(W-410,24,380,22,R.hp,R.shown,false,'#f2c14e');
  bar(30,52,200,8,L.gauge,L.gauge,true,L.gauge>=100?'#5cf':'#3a7bd5');bar(W-230,52,200,8,R.gauge,R.gauge,false,R.gauge>=100?'#5cf':'#3a7bd5');
  ctx.font='bold 18px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText('1P '+L.c.name,30,84);
  ctx.textAlign='right';ctx.fillText(R.c.name+' CPU',W-30,84);
  ctx.textAlign='center';ctx.font='bold 34px sans-serif';ctx.fillText(Math.ceil(timer),W/2,50);
  ctx.font='16px sans-serif';
  ctx.fillText('●'.repeat(wins[0])+'○'.repeat(2-wins[0])+'   '+'○'.repeat(2-wins[1])+'●'.repeat(wins[1]),W/2,76);
  if(L.gauge>=100&&tick%40<20){ctx.fillStyle='#5cf';ctx.textAlign='left';ctx.font='bold 14px sans-serif';ctx.fillText('필살기 준비! (L / C)',240,61);}
}
function drawFx(){
  for(const p of projs){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.c.body==='suit'){ctx.fillStyle='#fff';ctx.fillRect(-20,-26,40,52);ctx.fillStyle='#999';for(let i=0;i<5;i++)ctx.fillRect(-14,-18+i*8,28,3);
      ctx.fillStyle='#e5484d';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('이력서',0,-20+46);}
    else{ctx.fillStyle='#e9eefc';rr(-34,-20,68,40,16);ctx.fill();ctx.strokeStyle='#aab4d6';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#8899cc';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('Zzz',0,5);}
    ctx.restore();
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/30);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l/20);ctx.font='bold '+t.sz+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!banner)return;banner.t++;
  const a=Math.min(1,banner.t/10);ctx.globalAlpha=a;
  ctx.fillStyle='#000a';ctx.fillRect(0,H/2-80,W,150);
  ctx.textAlign='center';ctx.fillStyle='#f2c14e';ctx.font='bold 64px sans-serif';ctx.fillText(banner.lines[0],W/2,H/2);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText(banner.lines[1],W/2,H/2+44);
  ctx.globalAlpha=1;
  if(!banner.end&&banner.t>70)banner=null;
  if(banner&&banner.end&&banner.t>150){
    if(wins[0]>=2||wins[1]>=2){scene='over';banner=null;}
    else{round++;startRound();}
  }
}

// ---------- select / over screens ----------
let hover=0;
function drawSelect(){
  drawStage();ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#f2c14e';ctx.font='bold 48px sans-serif';ctx.fillText('얼굴 대전',W/2,80);
  ctx.fillStyle='#ddd';ctx.font='20px sans-serif';ctx.fillText('싸울 사람을 고르세요 · 남은 한 명이 상대(CPU)',W/2,118);
  CHARS.forEach((c,i)=>{
    const x=W/2+(i?150:-150),y=290,sc=hover===i?1.06:1;
    ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
    ctx.fillStyle=hover===i?'#f2c14e':'#555';rr(-120,-150,240,300,16);ctx.fill();
    ctx.fillStyle='#1b1726';rr(-114,-144,228,288,12);ctx.fill();
    const hw=150,hh=c.img.height/c.img.width*hw;
    ctx.save();rr(-hw/2,-130,hw,Math.min(hh,190),10);ctx.clip();if(c.img.complete)ctx.drawImage(c.img,-hw/2,-130,hw,hh);ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText(c.name,0,98);
    ctx.fillStyle='#aaa';ctx.font='15px sans-serif';ctx.fillText(c.sub+' · 필살: '+c.spName,0,124);
    ctx.restore();
  });
  ctx.fillStyle='#aaa';ctx.font='15px sans-serif';
  ctx.fillText('이동 ←→/AD · 점프 ↑/W · 막기 ↓/S · 펀치 J/Z · 킥 K/X · 필살기 L/C (게이지 가득일 때)',W/2,500);
  ctx.fillText('←→로 고르고 Enter, 또는 카드를 누르세요',W/2,524);
}
function drawOver(){
  drawStage();ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);
  const win=wins[0]>=2?P:E;
  ctx.textAlign='center';ctx.fillStyle='#f2c14e';ctx.font='bold 54px sans-serif';
  ctx.fillText(wins[0]>=2?'승리!':'패배...',W/2,110);
  const hw=180,hh=win.c.img.height/win.c.img.width*hw;
  ctx.save();ctx.beginPath();ctx.ellipse(W/2,270,hw/2,hh/2,0,0,7);ctx.clip();ctx.drawImage(win.c.img,W/2-hw/2,270-hh/2,hw,hh);ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText(win.c.name+' 최종 승리 ('+wins[0]+' : '+wins[1]+')',W/2,440);
  ctx.fillStyle='#aaa';ctx.font='18px sans-serif';ctx.fillText('화면을 누르거나 Enter → 다시 고르기',W/2,480);
}
function clickAt(x,y){
  if(scene==='select'){CHARS.forEach((c,i)=>{const cx=W/2+(i?150:-150);if(Math.abs(x-cx)<120&&Math.abs(y-290)<150)startMatch(i);});}
  else if(scene==='over')scene='select';
}

// ---------- loop ----------
function frame(){
  if(scene==='select'){
    if(pressed.left)hover=0;if(pressed.right)hover=1;if(pressed.start||pressed.punch)startMatch(hover);
    drawSelect();
  }else if(scene==='over'){
    if(pressed.start||pressed.punch)scene='select';drawOver();
  }else{
    const go=!banner||banner.end;
    if(slow>0)slow--;
    const step=slow>0?(tick%3===0):true;
    if(step){
      tick++;
      if(go&&!(banner&&banner.end)){
        const pi={...keys};pi.punch=pressed.punch;pi.kick=pressed.kick;pi.special=pressed.special;
        control(P,pi);control(E,cpuThink(E,P));
        timer-=1/60;
        if(timer<=0){timer=0;const w=P.hp>=E.hp?P:E,l=w===P?E:P;ko(w,l);banner.lines=['TIME UP',w.c.name+' 판정승'];}
      }
      update(P,E);update(E,P);updProj();
      for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.l--;}parts=parts.filter(p=>p.l>0);
      for(const t of texts){t.y-=1;t.l--;}texts=texts.filter(t=>t.l>0);
    }
    ctx.save();
    if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85;if(shake<0.5)shake=0;}
    drawStage();drawFighter(E);drawFighter(P);drawFx();
    ctx.restore();
    drawHUD();drawBanner();
  }
  for(const k in pressed)delete pressed[k];
  requestAnimationFrame(frame);
}
img2.onload=()=>requestAnimationFrame(frame);
</script></body></html>
