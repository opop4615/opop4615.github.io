<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>진석 파이터</title>
<style>
:root{color-scheme:dark;--bg:#0e0c14;--fg:#f4efe6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100vw;max-height:100vh}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#pad .g{display:grid;gap:8px;pointer-events:auto}
#pad .dir{grid-template-columns:repeat(3,58px)}
#pad .btn{grid-template-columns:repeat(3,58px)}
#pad button{width:58px;height:58px;border-radius:50%;border:2px solid #ffffff55;background:#00000088;color:#fff;font:700 14px/1 sans-serif;padding:0}
#pad button.hv{background:#7a1d1d99}
#pad button.sp{background:#f2c14e66}
@media (pointer:coarse){#pad{display:flex}#netbar{bottom:auto;top:calc(6px + env(safe-area-inset-top,0px))}}
[hidden]{display:none!important}
#onl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;padding:9px 14px;border-radius:8px;border:2px solid #f2c14e;background:#1a1624;color:#f2c14e;font:700 15px sans-serif;cursor:pointer}
#lobby{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:#000a;padding:16px}
#lobby .box{width:min(420px,100%);background:#1a1624;border:2px solid #4a4458;border-radius:14px;padding:22px;display:grid;gap:14px;color:#f4efe6}
#lobby h2{margin:0;font-size:22px;color:#f2c14e}
#lobby p{margin:0;font-size:14px;line-height:1.5;color:#cfc8da}
#lobby button{padding:11px 14px;border-radius:8px;border:0;background:#f2c14e;color:#1a1624;font:700 16px sans-serif;cursor:pointer}
#lobby button.sec{background:#332d40;color:#f4efe6}
#lobby .row{display:flex;gap:8px}
#lobby input{flex:1;min-width:0;padding:10px;border-radius:8px;border:2px solid #4a4458;background:#0e0c14;color:#fff;font:700 20px monospace;text-transform:uppercase;letter-spacing:4px}
#lobby .code{font:900 44px monospace;letter-spacing:8px;text-align:center;color:#7df9ff}
#lobby .link{font:13px monospace;word-break:break-all;color:#cfc8da;background:#0e0c14;padding:8px;border-radius:6px;user-select:text;-webkit-user-select:text}
#lobby #st{color:#7df9ff}
#netbar{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);white-space:nowrap;z-index:5;font:700 13px sans-serif;color:#7df9ff;background:#000a;padding:6px 10px;border-radius:6px;display:flex;gap:8px;align-items:center}
#netbar button{background:#332d40;color:#fff;border:0;border-radius:5px;padding:4px 8px;font:700 12px sans-serif;cursor:pointer}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body>
<button id="onl">온라인 대전</button>
<div id="netbar" hidden><span id="nbt"></span><button id="nbx">나가기</button></div>
<div id="lobby" hidden><div class="box">
  <h2>온라인 대전</h2>
  <div id="lmain" style="display:grid;gap:14px">
    <p>방을 만들면 코드가 나옵니다. 친구에게 코드나 링크를 보내면 둘이 1:1로 붙습니다. 방은 여러 개를 동시에 열 수 있습니다.</p>
    <button id="mk">방 만들기</button>
    <div class="row"><input id="code" maxlength="5" placeholder="코드" autocomplete="off"><button id="jn">들어가기</button></div>
  </div>
  <div id="lhost" hidden style="display:grid;gap:10px">
    <p>방 코드</p><div class="code" id="cd">·····</div>
    <div class="link" id="lk"></div><button class="sec" id="cp">링크 복사</button>
  </div>
  <p id="st"></p>
  <button class="sec" id="lx">닫기</button>
</div></div>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="pad">
  <div class="g dir"><span></span><button data-k="jump">점프</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
  <div class="g btn"><button data-k="A">약손</button><button data-k="S" class="hv">강손</button><button data-k="SUP" class="sp">필살</button><button data-k="D">약발</button><button data-k="F" class="hv">강발</button><span></span></div>
</div>

function begin(f,m){f.moveId=(f.moveId||0)+1;f.armorUsed=false;if(m.invul)f.invul=m.invul;f.st='attack';f.move=m;f.mt=0;f.connected=false;f.hitCount=0;f.lastHit=-99;f.crouch=m.anim[0]==='c'||m.anim==='lowkick'||m.anim==='sweep';

function qcf(f){const h=f.hist,n=h.length;let j=-1;for(let k=n-1;k>=Math.max(0,n-8);k--)if(h[k].fw){j=k;break;}if(j<0)return false;
  for(let k=j-1;k>=Math.max(0,j-15);k--)if(h[k].d&&!h[k].fw)return true;return false;}

function control(f,o,inp){
  f.backHeld=!!inp.back;f.downHeld=!!inp.down;
  f.hist.push({d:!!inp.down,fw:!!inp.fwd});if(f.hist.length>24)f.hist.shift();
  if(inp.S)f.lastS=tick;if(inp.F)f.lastF=tick;
  const ground=f.y>=GROUND&&f.vy>=0;
  const idle=f.st==='idle';
  const cancel=f.st==='attack'&&f.connected&&f.move.cancel&&f.mt>=f.move.startup;
  // super
  const supReq=inp.sup||((inp.S||inp.F)&&Math.abs(f.lastS-f.lastF)<=5);
  if(supReq&&f.gauge>=100&&ground&&(idle||cancel||(f.st==='attack'&&f.mt<6&&!f.move.special))){begin(f,specialMove(f.c,'sup'));return;}
  // specials
  let sp=inp.sp,strong=inp.strong;
  if(!sp&&(inp.A||inp.S||inp.D||inp.F)&&qcf(f)){sp=(inp.A||inp.S)?'hand':'foot';strong=inp.S||inp.F;}
  if(sp&&ground&&(idle||cancel)){f.hist.length=0;begin(f,specialMove(f.c,sp,strong));return;}
  const btn=inp.A?'A':inp.S?'S':inp.D?'D':inp.F?'F':null;
  if(btn){
    if(f.st==='jump'&&!f.airUsed){begin(f,N['j'+btn]);return;}
    if(ground&&(idle||(cancel&&f.move.cancel==='light'))){begin(f,N[(inp.down?'c':'s')+btn]);return;}
  }
  if(!idle||!ground)return;
  if(inp.jump){f.st='jump';f.airUsed=false;f.vy=-15.5;f.vx=(inp.fwd?1:inp.back?-1:0)*4.4*f.face;f.crouch=false;sfx.jump();return;}
  if(inp.down){f.crouch=true;f.vx=0;return;}
  f.crouch=false;
  const d=inp.fwd?1:inp.back?-0.72:0;f.vx=d*f.c.speed*f.face;if(d)f.walk+=0.22*d;
}

function hurtTop(o){return o.y-(o.crouch||o.st==='down'?150:220)*(o.c.scale||1);}
function boxHit(f,o,m){
  const sc=f.c.scale||1,dx=(o.x-f.x)*f.face;if(dx<-12||dx>m.reach*sc+28)return false;
  const at=f.y-m.top*sc,ab=f.y-m.bot*sc;return at<o.y&&ab>hurtTop(o);}
function canBlock(d,lv){if(!(d.st==='idle'||d.st==='block'))return false;if(d.y<GROUND)return false;if(!d.backHeld)return false;
  if(lv==='quake')return false;if(lv==='low')return d.downHeld;if(lv==='high')return !d.downHeld;return true;}
function hittable(d){if(d.invul>0||d.st==='down'||d.st==='ko')return false;if(d.st==='fall'&&d.juggle>=3)return false;return true;}

function doHit(a,d,m,hx,hy){
  if(m.kill){if(d.st==='ko'||phase!=='fight')return false;d.hp=0;d.flash=14;d.move=null;fx('kill',d.x,d.y,a.face);spark(d.x,d.y-120,'#ffd34d',30,true);
    say(d.x,d.y-280,'즉사!','#ff3b3b',40);hitstop=Math.max(hitstop,24);shake=30;ko(a,d);return true;}
  if(!hittable(d))return false;
  let dmg=(m.dmg||8)*a.c.pow;const lv=m.level||'mid';
  if(d.st==='attack'&&d.move&&d.move.armor&&d.mt<d.move.startup+d.move.active&&!d.armorUsed){d.armorUsed=true;d.hp=Math.max(0,d.hp-dmg*0.5);d.flash=6;
    spark(hx,hy,'#ff9d5c',10,true);sfx.block();hitstop=Math.max(hitstop,6);say(d.x,d.y-280,'버팀!','#ff9d5c',22);if(d.hp<=0)ko(a,d);return true;}
  if(canBlock(d,lv)){
    d.st='block';d.stun=m.bs||12;d.vx=a.face*(m.kb||4)*0.7;d.move=null;
    const chip=m.special&&!d.c.infinite?dmg*0.15:0;d.hp=Math.max(m.sup?0:1,d.hp-chip);

  const inCombo=d.st==='hit'||d.st==='fall';d.combo=inCombo?d.combo+1:1;
  dmg*=Math.max(0.35,1-0.12*(d.combo-1));if(!d.c.infinite)d.hp=Math.max(0,d.hp-dmg);d.move=null;d.flash=8;

  if(m.launch||m.kd||last||d.y<GROUND){d.st='fall';d.juggle=(inCombo?d.juggle:0)+1;d.vy=m.launch?-14:(d.y<GROUND?-7:-8);d.vx=a.face*((m.kb||4)*0.5+2);if(d.y>=GROUND)d.y=GROUND-1;}
  else{d.st='hit';d.stun=m.hs||16;d.vx=a.face*(m.kb||4);d.crouch=d.crouch&&!m.launch;}
  const big=dmg>=9;hitstop=Math.max(hitstop,4+Math.floor(dmg/2.5));shake=Math.max(shake,big?10:4);

  say(d.x+(Math.random()*30-15),d.y-260,d.c.infinite?'무효':Math.round(dmg),'#fff',big?30:22);

  a.gauge=Math.min(100,a.gauge+dmg*1.6);d.gauge=Math.min(100,d.gauge+dmg*0.9);

function ko(w,l){if(phase!=='fight')return;l.st='ko';l.vy=-12;l.vx=w.face*7;l.y=Math.min(l.y,GROUND-1);phase='ko';phaseT=0;slow=80;shake=24;sfx.ko();

function physics(f,o){
  const air=f.y<GROUND||f.vy<0;
  if(air||f.st==='fall'||f.st==='ko'){f.vy+=0.8;}
  f.x+=f.vx;f.y+=f.vy;
  if(f.y>=GROUND){
    const wasAir=f.vy>0;f.y=GROUND;
    if(wasAir){
      if(f.st==='jump'||(f.st==='attack'&&f.move&&(f.move.air||f.move.dive))){f.st='idle';f.move=null;f.vx=0;dust(f.x);sfx.land();if(f.move&&f.move.dive){} }
      else if(f.st==='fall'){f.st='down';f.kdT=42;f.vx*=0.4;dust(f.x);sfx.land();shake=Math.max(shake,6);}
      else if(f.st==='ko'&&f.vy>3){f.vy=-f.vy*0.3;f.vx*=0.6;dust(f.x);if(Math.abs(f.vy)<2)f.vy=0;}
    }

    if(f.st==='attack'&&!f.move.rush)f.vx*=0.7;

  if(f.x>W-40){f.x=W-40;if(o.st==='attack'&&(f.st==='hit'||f.st==='block'))o.x-=2.5;}
}
function separate(){const dx=E.x-P.x,ov=58-Math.abs(dx);
  if(ov>0&&Math.abs(E.y-P.y)<120&&P.st!=='ko'&&E.st!=='ko'&&P.st!=='down'&&E.st!=='down'){const s=Math.sign(dx)||1;P.x-=s*ov/2;E.x+=s*ov/2;}}

function step(f,o){
  if(f.c.infinite)f.gauge=100;
  if(f.invul>0)f.invul--;if(f.flash>0)f.flash--;f.anim++;
  if(f.comboShow&&--f.comboShow.t<=0)f.comboShow=null;
  if((f.st==='idle'||f.st==='block')&&f.y>=GROUND)f.face=o.x>f.x?1:-1;
  if(f.st==='hit'||f.st==='block'){if(--f.stun<=0){f.st='idle';}}
  if(f.st==='down'){if(--f.kdT<=0){f.st='idle';f.invul=18;f.juggle=0;f.crouch=false;}}
  if(f.st==='attack'){
    const m=f.move;f.mt++;const t=f.mt;
    if(m.rush&&t>=m.startup&&t<m.startup+m.active)f.vx=f.face*m.rush;else if(m.rush&&t>=m.startup+m.active)f.vx*=0.6;
    if(m.quake){if(t===1)f.vy=-14;if(t===m.startup){shake=30;for(let i=0;i<W;i+=60)dust(i);}}
    if(m.fxAt===t){f.tx=o.x;fx(m.fxKind,o.x,o.y,f.face);}
    if(m.warp&&t===m.startup){const side=o.x>f.x?1:-1;f.x=Math.max(50,Math.min(W-50,o.x+side*70));f.face=-side;f.vx=0;}
    if(m.rise&&t===m.startup){f.vy=-15;f.vx=f.face*2.2;}
    if(m.dive){if(t===1){f.vy=-13;f.vx=f.face*2;}if(t===m.startup){f.vy=11;f.vx=f.face*9;}}
    if(m.proj&&t===m.startup&&!projs.some(p=>p.owner===f)){const p=m.proj;projs.push({x:f.x+f.face*60,y:p.ground?f.y-27:f.y-(p.big?150:170),vx:f.face*p.speed,owner:f,m:{dmg:p.dmg,hs:22,bs:14,kb:6,special:true,sup:!!p.big,kd:!!p.big,level:p.level||'mid'},kind:p.kind,w:p.w,h:p.h,rot:0,life:200});}
    const act=t>=m.startup&&t<m.startup+m.active&&!(m.dive&&t<m.startup);
    if(act&&(m.beam||m.quake||m.auto||!m.proj)){
      const multi=m.hits&&m.hits>1;
      if((!multi&&f.hitCount===0)||(multi&&f.hitCount<m.hits&&t-f.lastHit>=m.rehit)){
        let ok=false;
        if(m.beam){ok=(o.x-f.x)*f.face>0&&f.y-m.top<o.y&&f.y-m.bot>hurtTop(o);}
        else if(m.quake){ok=o.y>=GROUND-6;}
        else if(m.auto){ok=o.st!=='ko';}
        else ok=boxHit(f,o,m);
        if(ok&&(m.kill||hittable(o))){const hx=(m.beam||m.quake||m.auto)?o.x-f.face*20:f.x+f.face*Math.min(m.reach,Math.abs(o.x-f.x)),hy=f.y-(m.top+m.bot)/2;
          if(doHit(f,o,m,hx,Math.max(o.y-200,Math.min(o.y-20,hy)))){f.connected=true;f.hitCount++;f.lastHit=t;if(m.rush&&!multi)f.vx=0;}}
      }
    }
    if(f.st==='attack'&&t>=m.startup+m.active+m.recover){f.move=null;f.st=f.y<GROUND?'jump':'idle';if(f.st==='jump')f.airUsed=true;}
  }
  if(f.st==='attack'&&f.move&&f.move.dive&&f.y>=GROUND&&f.mt>f.move.startup){f.move=null;f.st='idle';}
}

// ---------- AI ----------
function aiInput(f,o){
  const inp={};const ai=f.ai;const dist=Math.abs(o.x-f.x);const r=Math.random();
  if(f.st==='hit'||f.st==='fall'||f.st==='down'||f.st==='ko'){ai.queue=[];ai.plan=null;return inp;}
  // combo continuation
  if(f.st==='attack'){
    if(ai.queue.length&&f.connected&&f.mt>=f.move.startup+1){const q=ai.queue.shift();return qInp(q);}
    if(!f.connected&&f.mt>=f.move.startup+f.move.active)ai.queue=[];
    return inp;}
  // threats
  if(o.st==='attack'&&o.move&&ai.seenMove!==o.moveId){ai.seenMove=o.moveId;
    const reach=o.move.beam?999:(o.move.reach||80)+80;
    if(dist<reach&&Math.random()<0.5){ai.blockT=o.move.startup+o.move.active+6;ai.blockLow=o.move.level==='low';}}
  for(const p of projs)if(p.owner===o&&ai.seenProj!==p&&Math.abs(p.x-f.x)<300){ai.seenProj=p;
    const q=Math.random();if(q<0.35&&dist>170&&!p.m.sup){inp.jump=1;inp.fwd=1;return inp;}if(q<0.85){ai.blockT=40;ai.blockLow=false;}}
  if(ai.blockT>0){ai.blockT--;inp.back=1;if(ai.blockLow)inp.down=1;return inp;}
  // anti-air
  if((o.st==='jump'||(o.st==='attack'&&o.move&&o.move.air))&&o.y<GROUND-60&&dist<170&&ai.aaJump!==o.vy>0){ai.aaJump=o.vy>0;
    if(o.vy>0&&Math.random()<0.45&&f.y>=GROUND)return f.c.sp.foot[1]==='rising'?{sp:'foot',strong:true}:{down:1,S:1};}
  // jump-in attack
  if(f.st==='jump'&&!f.airUsed&&dist<120&&f.vy>0)return {F:1};
  if(f.st!=='idle')return inp;
  if(--ai.think<=0||!ai.plan){
    ai.think=6+Math.random()*12;ai.planT=10+Math.random()*25;
    const sup=f.c.sp.sup[1];
    if(f.gauge>=100&&(dist<170||sup==='beam'||sup==='bigproj'||sup==='stomp')&&r<0.5)ai.plan='sup';
    else if(dist<100){const q=Math.random();ai.plan=q<0.62?'combo':q<0.75?'back':q<0.88?'guard':'jumpback';}
    else if(dist<190){const q=Math.random();ai.plan=q<0.25?'poke':q<0.37?'spfoot':q<0.85?'fwd':'guard';}
    else{const q=Math.random();ai.plan=q<0.24?'proj':q<0.34?'jumpin':q<0.86?'fwd':'back';}
  }
  const p=ai.plan;ai.planT--;if(ai.planT<=0)ai.plan=null;
  switch(p){
    case 'fwd':return {fwd:1};
    case 'back':return {back:1};
    case 'guard':return {back:1,down:Math.random()<0.5?1:0};
    case 'jumpin':ai.plan=null;return {jump:1,fwd:1};
    case 'jumpback':ai.plan=null;return {jump:1,back:1};
    case 'proj':ai.plan=null;return {sp:'hand',strong:Math.random()<0.5};
    case 'spfoot':ai.plan=null;return {sp:'foot',strong:Math.random()<0.5};
    case 'sup':ai.plan=null;return {sup:1};
    case 'poke':ai.plan=null;return qInp(['sD','sF','cF','sS'][Math.random()*4|0]);
    case 'combo':{ai.plan=null;const C=[['sA','sA','sS'],['cD','cA','sp:hand'],['sD','sF'],['sA','sS','sp:foot'],['cD','cF'],['sS','sp:hand'],['cA','cA','cS']];
      const c=C[Math.random()*C.length|0].slice();ai.queue=c.slice(1);return qInp(c[0]);}
  }
  return inp;
}
function qInp(q){if(q.startsWith('sp:'))return {sp:q.slice(3),strong:Math.random()<0.5};const i={down:q[0]==='c'?1:0};i[q[1]]=1;return i;}

function playerInput(f){const fw=f.face>0?'right':'left',bk=f.face>0?'left':'right';
  return {fwd:keys[fw],back:keys[bk],down:keys.down,jump:pressed.jump,A:pressed.A,S:pressed.S,D:pressed.D,F:pressed.F};}

const R=Math.PI/180;
function limb(o,a1,l1,a2,l2){const e=[o[0]+Math.cos(a1*R)*l1,o[1]+Math.sin(a1*R)*l1];return [o,e,[e[0]+Math.cos(a2*R)*l2,e[1]+Math.sin(a2*R)*l2]];}

function pose(f){
  let hip=[0,-86],sh=[4,-152],fA=[55,-78],bA=[85,-82],fL=[70,100],bL=[110,85],rot=0,tilt=0,flip=1;
  const b=Math.sin(f.anim*0.09)*2;hip[1]+=b*0.4;sh[1]+=b;
  const m=f.move,t=f.mt;let e=0;
  if(m){if(t<m.startup)e=t/m.startup*0.35;else if(t<m.startup+m.active)e=1;else e=Math.max(0,1-(t-m.startup-m.active)/Math.max(1,m.recover));}
  const crouchBase=()=>{hip=[0,-56];sh=[10,-118];fL=[5,100];bL=[165,70];};
  const jumpBase=()=>{fL=[20,120];bL=[80,150];};
  const st=f.st;
  if(st==='idle'){
    if(f.crouch)crouchBase();
    else if(Math.abs(f.vx)>0.3){const s=Math.sin(f.walk);fL=[80+s*22,100+s*10];bL=[100-s*22,90-s*10];}
    if(f.backHeld&&f.y>=GROUND){}
  }else if(st==='jump'){jumpBase();}
  else if(st==='block'){if(f.downHeld)crouchBase();fA=[25,-115];bA=[40,-118];sh[0]-=4;}
  else if(st==='hit'){if(f.crouch)crouchBase();sh[0]-=14;hip[0]-=4;fA=[130,60];bA=[150,70];tilt=-0.3;}
  else if(st==='fall'||st==='ko'){jumpBase();fA=[160,-20];bA=[200,-30];rot=-45-(f.y>=GROUND?45:0);tilt=-0.2;}
  else if(st==='down'){rot=-90;fA=[160,0];bA=[190,0];fL=[95,90];bL=[85,90];}
  else if(st==='win'){fA=[-75,-95];bA=[110,-60];if(Math.floor(f.anim/20)%2)hip[1]-=4;}
  else if(st==='attack'&&m){
    switch(m.anim){
      case 'jab':fA=[lerp(55,-2,e),lerp(-78,-2,e)];sh[0]+=6*e;break;
      case 'straight':bA=[lerp(85,-4,e),lerp(-82,-4,e)];sh[0]+=16*e;hip[0]+=4*e;fA=[70,-100];fL=[60,100];bL=[125,80];break;
      case 'kick':fL=[lerp(70,-5,e),lerp(100,-5,e)];sh[0]-=14*e;bL=[100,90];break;
      case 'round':fL=[lerp(70,-38,e),lerp(100,-25,e)];sh[0]-=22*e;bL=[95,90];fA=[40,-80];break;
      case 'cjab':crouchBase();fA=[lerp(55,-2,e),lerp(-78,-2,e)];sh[0]+=6*e;break;
      case 'upper':crouchBase();hip[1]=lerp(-56,-90,e);sh=[lerp(10,14,e),lerp(-118,-162,e)];fA=[lerp(55,-70,e),lerp(-78,-95,e)];fL=[lerp(5,70,e),lerp(100,100,e)];bL=[lerp(165,110,e),lerp(70,85,e)];break;
      case 'lowkick':crouchBase();fL=[lerp(5,22,e),lerp(100,12,e)];break;
      case 'sweep':crouchBase();hip[1]=-46;sh=[-6,-104];fL=[lerp(5,12,e),lerp(100,6,e)];bA=[120,90];break;
      case 'jpunch':jumpBase();fA=[lerp(55,35,e),lerp(-78,35,e)];break;
      case 'jkick':jumpBase();fL=[lerp(20,35,e),lerp(120,35,e)];break;
      case 'throw':bA=[lerp(-150,-4,e),lerp(-120,-4,e)];sh[0]+=14*e;fA=[100,-60];fL=[60,100];bL=[125,80];break;
      case 'spin':fL=[-5,-5];bL=[100,90];sh[0]-=10;flip=(Math.floor(t/4)%2)?-1:1;break;
      case 'headbutt':sh=[lerp(4,34,e),lerp(-152,-138,e)];fA=[150,110];bA=[160,120];fL=[60,100];bL=[130,75];tilt=0.35*e;break;
      case 'dive':jumpBase();fL=[40,40];bL=[80,150];rot=t>=m.startup?20:0;break;
      case 'tackle':sh=[lerp(4,28,e),lerp(-152,-140,e)];fA=[70,60];bA=[95,80];fL=[55,100];bL=[135,75];tilt=0.25*e;break;
      case 'stomp':if(f.y<GROUND-2){jumpBase();fA=[-60,-80];bA=[-110,-90];}else{crouchBase();fA=[-10,20];bA=[190,-20];}break;

  else if(scene==='over'){overT++;drawOver();if(overT>30&&(pressed.start||pressed.A))backToSelect(true);}

    if(phase==='fight'){
      const pin=playerInput(P),ein=net.mode==='host'?remoteInput(E):aiInput(E,P);control(P,E,pin);control(E,P,ein);
      if(tick%60===0&&timer>0){timer--;if(timer<=0){const w=P.hp/P.max>=E.hp/E.max?P:E;phase='timeover';phaseT=0;wins[w===P?0:1]++;lastWinner=w;}}
    }else{P.backHeld=E.backHeld=false;}
    step(P,E);step(E,P);
    if(phase!=='fight'&&phase!=='intro'){for(const f of [P,E])if(f.st==='idle'&&f===lastWinner&&f.y>=GROUND){f.st='win';}}
    physics(P,E);physics(E,P);separate();
    for(const p of projs){p.x+=p.vx;p.rot+=0.25;p.life--;const o=p.owner===P?E:P;
      if(Math.random()<0.6)parts.push({x:p.x-Math.sign(p.vx)*20,y:p.y+(Math.random()-.5)*20,vx:-p.vx*0.1,vy:(Math.random()-.5),l:16,c:p.kind==='fire'?'#ff7a2f':'#ffffffaa',sz:5});
      if(Math.abs(p.x-o.x)<p.w/2+26&&p.y+p.h/2>hurtTop(o)&&p.y-p.h/2<o.y&&hittable(o)){if(doHit(p.owner,o,p.m,p.x,p.y))p.life=0;}}
    for(const a of projs)for(const b of projs)if(a!==b&&a.owner!==b.owner&&a.life>0&&b.life>0&&Math.abs(a.x-b.x)<40){if(a.m.sup&&!b.m.sup)b.life=0;else if(b.m.sup&&!a.m.sup)a.life=0;else{a.life=b.life=0;}spark(a.x,a.y,'#fff',12,true);sfx.block();}
    projs=projs.filter(p=>p.life>0&&p.x>-80&&p.x<W+80);
    cosmetics();
  }
  if(phase==='intro'&&phaseT>110)phase='fight';
  if((phase==='ko'||phase==='timeover')&&phaseT>200){
    if(wins[0]>=2||wins[1]>=2){scene='over';overT=0;if(net.mode==='host')send({t:'over',wins});}else{round++;startRound();}}
}
function drawFight(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.86;if(shake<0.5)shake=0;}
  drawStage(CHARS[ei].stage);
  if(superFlash){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(-20,-20,W+40,H+40);}
  const order=(E.st==='attack')?[P,E]:[E,P];
  drawBigFx(true);
  for(const f of order)drawFighter(f);
  drawBigFx(false);
  for(const p of projs)drawProj(p);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/24);if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r+(12-p.l)*5,0,7);ctx.stroke();}else{ctx.fillStyle=p.c;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}}
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l/20);ctx.font='bold '+t.sz+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;ctx.restore();
  drawHUD();
  if(superFlash){const s=superFlash;ctx.save();ctx.globalAlpha=Math.min(1,s.t/6);ctx.fillStyle='#000a';ctx.fillRect(0,170,W,110);
    portrait(s.f,s.f===P?110:W-110,225,46);ctx.textAlign='center';ctx.font='italic 900 54px sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(s.name,W/2,245);ctx.fillStyle='#7df9ff';ctx.fillText(s.name,W/2,245);ctx.restore();}
  if(phase==='intro'){if(phaseT<70)bigText('ROUND '+round);else{bigText('FIGHT!','', '#ff5a3d');}}
  if(phase==='ko'&&phaseT<170)bigText('K.O.',lastWinner.c.name+' 승리','#ff3b3b');
  if(phase==='timeover'&&phaseT<170)bigText('TIME OVER',lastWinner.c.name+' 판정승');
}
// ---------- online (PeerJS, host-authoritative) ----------
const net={mode:'off',role:null,peer:null,conn:null,code:null,rk:[0,0,0],rp:{},ev:[],myPick:null,oppPick:null,lastSig:''};
const $=id=>document.getElementById(id);const onlBtn=$('onl');
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function me(){return net.mode==='guest'?E:P;}
function rec(type,args){if(net.mode==='host'&&scene==='fight')net.ev.push([type,args]);}
function send(o){try{if(net.conn&&net.conn.open)net.conn.send(o);}catch(e){}}
function remoteInput(f){const h=net.rk,p=net.rp;net.rp={};const fw=f.face>0?h[1]:h[0],bk=f.face>0?h[0]:h[1];
  return {fwd:fw,back:bk,down:h[2],jump:p.jump,A:p.A,S:p.S,D:p.D,F:p.F};}
const FK=['x','y','vx','face','hp','gauge','st','mt','crouch','downHeld','invul','flash','anim','walk','hitCount'];
function ser(f){const o={};for(const k of FK)o[k]=typeof f[k]==='number'?Math.round(f[k]*100)/100:f[k];o.mk=f.move?f.move.key:null;o.cs=f.comboShow||null;return o;}
function sendSnap(){send({t:'s',P:ser(P),E:ser(E),pr:projs.map(p=>[Math.round(p.x),Math.round(p.y),p.vx,p.kind,Math.round(p.rot*100)/100]),
  timer,phase,phaseT,round,wins,shake:Math.round(shake),lw:lastWinner?(lastWinner===P?0:1):-1,sf:superFlash?{w:superFlash.f===P?0:1,t:superFlash.t,name:superFlash.name}:null,ev:net.ev});net.ev=[];}
function applySnap(d){if(!P||!E)return;scene='fight';
  for(const [f,o] of [[P,d.P],[E,d.E]]){for(const k of FK)f[k]=o[k];f.move=o.mk?moveFromKey(f.c,o.mk):null;f.comboShow=o.cs;}
  projs=d.pr.map(a=>({x:a[0],y:a[1],vx:a[2],kind:a[3],rot:a[4]}));
  timer=d.timer;phase=d.phase;phaseT=d.phaseT;round=d.round;wins=d.wins;shake=Math.max(shake,d.shake);lastWinner=d.lw<0?null:d.lw?E:P;
  superFlash=d.sf?{f:d.sf.w?E:P,t:d.sf.t,name:d.sf.name}:null;
  for(const [type,a] of d.ev){if(type==='sfx'){sfx[a[0]]();}else if(type==='spark')spark(...a);else if(type==='dust')dust(...a);else if(type==='fx')fx(...a);else if(type==='say')say(...a);}}
function choose(i){
  if(net.mode==='off'){pi=i;startMatch();return;}
  net.myPick=i;sfx.sel();send({t:'pick',ci:i});tryStart();}
function tryStart(){if(net.mode!=='host'||net.myPick==null||net.oppPick==null)return;
  pi=net.myPick;ei=net.oppPick;wins=[0,0];round=1;scene='vs';vsT=0;sfx.ann();send({t:'start',pi,ei});}
function backToSelect(tell){net.myPick=null;net.oppPick=null;scene='select';if(tell)send({t:'sel'});}
function onData(d){
  switch(d.t){
    case 'i':net.rk=d.h;for(const k of d.p)net.rp[k]=true;break;
    case 'pick':net.oppPick=d.ci;tryStart();break;
    case 'start':pi=d.pi;ei=d.ei;wins=[0,0];round=1;P=Fighter(pi,300,1,false);E=Fighter(ei,660,-1,false);projs=[];parts=[];texts=[];scene='vs';vsT=0;sfx.ann();break;
    case 's':if(scene==='vs'||scene==='fight')applySnap(d);break;
    case 'over':wins=d.wins;scene='over';overT=0;break;
    case 'sel':backToSelect(false);break;
  }}
function status(t){$('st').textContent=t;}
function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.random()*a.length|0];return s;}
function pid(code){return 'jinseok-fighter-v1-'+code;}
function setupConn(c){
  c.on('open',()=>{if(net.conn&&net.conn!==c){c.close();return;}net.conn=c;net.mode=net.role;$('lobby').hidden=true;
    $('netbar').hidden=false;$('nbt').textContent='온라인 · 방 '+net.code+' · '+(net.role==='host'?'방장(왼쪽)':'참가(오른쪽)');
    backToSelect(false);sfx.ann();});
  c.on('data',onData);
  c.on('close',()=>{if(net.conn===c)leave('상대와 연결이 끊겼습니다.');});
  c.on('error',()=>{});}
function hostRoom(){if(typeof Peer==='undefined'){status('온라인 모듈을 불러오지 못했습니다. 새로고침해 보세요.');return;}
  cleanup();net.role='host';net.code=newCode();status('방을 여는 중…');
  const peer=new Peer(pid(net.code),{config:ICE});net.peer=peer;
  peer.on('open',()=>{$('lmain').hidden=true;$('lhost').hidden=false;$('cd').textContent=net.code;
    const url=location.origin+location.pathname+'#'+net.code;$('lk').textContent=url;status('상대를 기다리는 중…');});
  peer.on('connection',c=>{if(net.conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300);});return;}setupConn(c);});
  peer.on('error',e=>{if(e.type==='unavailable-id'){hostRoom();return;}status('오류: '+e.type);});}
function joinRoom(code){code=(code||'').trim().toUpperCase();if(code.length!==5){status('코드 다섯 자를 넣어 주세요.');return;}
  if(typeof Peer==='undefined'){status('온라인 모듈을 불러오지 못했습니다. 새로고침해 보세요.');return;}
  cleanup();net.role='guest';net.code=code;status('방에 들어가는 중…');$('lobby').hidden=false;
  const peer=new Peer({config:ICE});net.peer=peer;
  peer.on('open',()=>{const c=peer.connect(pid(code),{reliable:true});c.on('data',d=>{if(d.t==='full')status('이미 두 명이 들어간 방입니다.');});setupConn(c);
    setTimeout(()=>{if(!net.conn&&net.peer===peer)status('연결이 안 됩니다. 같은 와이파이거나 다른 망으로 다시 해 보세요.');},12000);});
  peer.on('error',e=>{status(e.type==='peer-unavailable'?'그 코드의 방이 없습니다.':'오류: '+e.type);});}
function cleanup(){try{net.conn&&net.conn.close();}catch(e){}try{net.peer&&net.peer.destroy();}catch(e){}net.conn=null;net.peer=null;net.mode='off';}
function leave(msg){cleanup();net.role=null;$('netbar').hidden=true;backToSelect(false);
  if(msg){$('lobby').hidden=false;$('lmain').hidden=false;$('lhost').hidden=true;status(msg);}}
onlBtn.onclick=()=>{A();$('lobby').hidden=false;$('lmain').hidden=false;$('lhost').hidden=true;status('');};
$('mk').onclick=hostRoom;$('jn').onclick=()=>joinRoom($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom($('code').value);});
$('lx').onclick=()=>{if(!net.conn){cleanup();net.role=null;}$('lobby').hidden=true;};
$('nbx').onclick=()=>leave(null);
$('cp').onclick=()=>{const t=$('lk').textContent;try{navigator.clipboard.writeText(t).then(()=>status('복사했습니다. 친구에게 보내세요.'),()=>status('길게 눌러 복사하세요.'));}catch(e){status('길게 눌러 복사하세요.');}};
if(/^#[A-Za-z0-9]{5}$/.test(location.hash)){const c=location.hash.slice(1);$('code').value=c.toUpperCase();setTimeout(()=>joinRoom(c),300);}
let started=0;IMG.forEach(i=>{const go=()=>{if(++started===IMG.length)requestAnimationFrame(frame);};i.complete&&i.naturalWidth?go():i.onload=go;});
