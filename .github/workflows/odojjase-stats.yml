name: odojjase-stats

# 오도짜세 현황 수집. 30분마다 명예해병 명부·출시 글 반응·다룬 곳·스토어를 읽어
# odojjase-stats-data 브랜치에 latest.json · history.jsonl · hall_rows.json을 올린다.
# 페이지(odojjase-stats/index.html)가 그 셋을 읽는다. 명부 읽기는 공개다. 플레이 기록(ev, 1.5.1부터)만 비밀값
# ODOJJASE_EV_REFRESH(수집기 전용 익명 계정의 refresh 토큰)로 읽고, 요약만 latest.json에, uid를 섞은 줄은 ev_rows.json에 둔다.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
  # 깃허브는 예약 실행을 자주 건너뛴다(11-20: 12:43 뒤로 5시간 넘게 한 번도 안 돎). 사용자 결정으로 외부 알람은 붙이지 않고 그대로 둔다
  push:  # 수집기나 이 파일을 고치면 바로 한 번 돈다 — 고친 것이 도는지 그 자리에서 본다
    branches: [main]
    paths:
      - .github/scripts/odojjase_stats.py
      - .github/scripts/odojjase_ev.py
      - .github/workflows/odojjase-stats.yml

permissions:
  contents: write

concurrency:
  group: odojjase-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet google-play-scraper==1.2.7 beautifulsoup4==4.12.3

      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
          ODOJJASE_EV_REFRESH: ${{ secrets.ODOJJASE_EV_REFRESH }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" odojjase-stats-data >/dev/null; then
            git clone --quiet --depth 1 --branch odojjase-stats-data "$url" data
          else
            mkdir data && git -C data init --quiet && git -C data remote add origin "$url"
          fi
          python .github/scripts/odojjase_stats.py data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan next
          git add -A
          git commit --quiet -m "odojjase-stats $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push --quiet --force origin next:odojjase-stats-data
