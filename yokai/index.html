:root {
  --green: #2b5848;
  --green-2: #234a3c;
  --lac: #35201a;
  --lac-2: #4a2c22;
  --edge: #160d0a;
  --gold: #e0ad48;
  --cream: #f7f0dc;
  --mute: #b9d1c4;
  --paper: #ecc458;
  --ink: #9e2219;
  --ink-soft: #6e3a12;
  --pix: "Galmuri", "GalmuriJA", "Gowun Dodum", monospace;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
/* 일본어: 본문은 한글 글꼴(한국식 한자 모양) 대신 일본어 시스템 글꼴로 */
html[lang="ja"] {
  --pix: "GalmuriJA", "Galmuri", "Hiragino Sans", "Noto Sans JP", monospace;  /* 、。「」 같은 부호도 일본어 판 모양으로 */
  --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Noto Sans CJK JP", "Meiryo", system-ui, sans-serif;
}
html[lang="ja"] h1, html[lang="ja"] h2, html[lang="ja"] h3, html[lang="ja"] .cause { word-break: auto-phrase; }
html, body { background: var(--green); color: var(--cream); }
body { font-family: var(--body); font-size: 16px; line-height: 1.7; margin: 0; }
.band { height: 63px; background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAVCAYAAABc6S4mAAAAa0lEQVR4nGPk4+L7z0BDwERLw+liAWPShmmjQYQXsJw5cYkkDRvuINQHqOgRVD/0g4hRryKDYCqq2bKHoEEtPi5w9jqje3D2CAkiZGA0Zw2cfS4lhKD6oR9ELKRqICZYkMHQDyLG0RqNEAAAlKMX32X2oloAAAAASUVORK5CYII=) repeat-x 0 0 / 72px 63px; image-rendering: pixelated; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 18px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.top b { font-family: var(--pix); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.langs { display: flex; gap: 10px; margin-right: 4px; }
.lang { background: var(--lac); border: 0; box-shadow: 0 0 0 2px var(--edge), 0 0 0 4px var(--gold); color: var(--cream); padding: 4px 9px; font: 400 11px var(--pix); cursor: pointer; }
.lang[aria-pressed="true"] { background: var(--paper); color: #2a1a05; font-weight: 700; cursor: default; }
button { font-family: var(--body); }
:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
img.px { image-rendering: pixelated; }

/* 판: 옻칠 바탕에 검은 테 + 금테, 둥근 모서리·번지는 그림자 없음 */
.panel { background: var(--lac); box-shadow: 0 0 0 4px var(--edge), 0 0 0 8px var(--gold), 8px 8px 0 8px rgba(22,13,10,.35); margin: 8px; padding: 22px 18px; }

/* 시작 */
.hero { display: flex; flex-direction: column; gap: 16px; }
.hero h1 { font-family: var(--pix); font-weight: 700; font-size: 33px; line-height: 1.35; margin: 0; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--paper); }
.hero p { margin: 0; color: var(--mute); max-width: 36ch; }
.lineup { display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 6px 0 0; border-bottom: 4px solid var(--edge); overflow: hidden; }
.lineup img { flex: none; }
.go { align-self: stretch; background: var(--paper); color: #2a1a05; border: 0; padding: 16px 20px; font: 700 22px var(--pix); cursor: pointer; box-shadow: inset 0 -6px 0 #b8862c, 0 0 0 4px var(--edge); margin: 4px; }
.go:active { box-shadow: inset 0 -2px 0 #b8862c, 0 0 0 4px var(--edge); transform: translateY(2px); }
.small { font: 400 11px var(--pix); color: var(--mute); letter-spacing: .02em; }

/* 질문 */
.q { display: flex; flex-direction: column; gap: 18px; }
.prog { display: flex; align-items: center; gap: 12px; font: 400 11px var(--pix); color: var(--mute); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--edge); }
.bar i { display: block; height: 100%; background: var(--paper); transition: width .25s steps(4); }
.q h2 { font-family: var(--pix); font-weight: 700; font-size: 22px; line-height: 1.5; margin: 0; }
.opts { display: grid; gap: 12px; }
.opt { text-align: left; background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 14px 16px; font-size: 16px; cursor: pointer; margin: 3px; }
.opt:hover, .opt:focus-visible { box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--gold); outline: 0; }
.back { align-self: flex-start; background: none; border: 0; color: var(--mute); font: 400 11px var(--pix); cursor: pointer; padding: 4px 0; }

/* 결과: 괴황지 부적 */
.lead { font: 400 11px var(--pix); color: var(--mute); margin: 0; }
.charm { position: relative; background: var(--paper); color: var(--ink); padding: 26px 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 4px var(--edge), 8px 8px 0 4px rgba(22,13,10,.35); margin: 4px; }
.charm::before { content: ""; position: absolute; inset: 10px; border: 3px solid var(--ink); pointer-events: none; }
.charm .who { display: flex; align-items: flex-end; justify-content: center; min-height: 190px; padding-top: 8px; }
.charm .who img { max-width: 100%; height: auto; }
.charm h2 { font-family: var(--pix); font-weight: 700; font-size: 33px; line-height: 1.3; text-align: center; margin: 0; }
.stamp { position: absolute; top: 22px; right: 20px; width: 70px; height: 70px; border: 4px solid var(--ink); color: var(--ink); font: 700 11px/1.5 var(--pix); display: grid; place-items: center; text-align: center; transform: rotate(8deg); }
.charm dl { margin: 0; display: grid; gap: 12px; position: relative; }
.charm dt { font: 700 11px var(--pix); letter-spacing: .04em; color: var(--ink-soft); }
.charm dd { margin: 2px 0 0; color: #3a1d0a; font-size: 15.5px; }
.charm .god { display: flex; align-items: center; gap: 10px; }
.charm .god img { flex: none; }

.row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 11px 16px; font: 400 11px var(--pix); cursor: pointer; margin: 3px; }
.btn:hover, .btn:focus-visible { box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--gold); outline: 0; }
.btn.main { width: calc(100% - 8px); margin: 4px; background: var(--paper); color: #2a1a05; font: 700 22px var(--pix); padding: 16px; box-shadow: inset 0 -6px 0 #b8862c, 0 0 0 4px var(--edge); }
.sh { background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 8px 14px; font: 400 11px var(--pix); cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 3px; }
.ic.kakao { background: #fee500; color: #191919; width: 26px; height: 26px; display: grid; place-items: center; font-weight: 900; }
.friend { background: var(--lac); box-shadow: 0 0 0 3px var(--edge); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin: 3px; }
.note { min-height: 1.4em; font-size: 13px; color: var(--paper); margin: 0; }
.copybox { width: 100%; box-sizing: border-box; background: var(--lac); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 10px; font: 13px/1.5 var(--body); }
.nick { display: flex; flex-direction: column; gap: 6px; }
.nick input { background: var(--lac); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 12px 14px; font: 16px var(--body); margin: 3px; }
.nick input:focus-visible { box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--gold); outline: 0; }
.reveal { display: grid; place-items: center; gap: 18px; min-height: 260px; text-align: center; font: 700 22px var(--pix); }
.reveal p { margin: 0; }
.book { display: flex; gap: 6px; }
.book i { width: 26px; height: 36px; background: var(--paper); box-shadow: 0 0 0 3px var(--edge); }
@media (prefers-reduced-motion: no-preference) {
  .book i { animation: flip .5s steps(2) infinite; }
  .book i:nth-child(2) { animation-delay: .17s; } .book i:nth-child(3) { animation-delay: .34s; }
  @keyframes flip { 50% { transform: scaleX(.15); } }
  .charm .stamp { animation: thump .45s steps(3) both .15s; }
  @keyframes thump { from { transform: rotate(8deg) scale(2.2); opacity: .2; } to { transform: rotate(8deg) scale(1); opacity: 1; } }
}
.ledger { margin: 0; font: 700 11px var(--pix); color: var(--ink-soft); letter-spacing: .04em; position: relative; }
.cause { margin: 0; text-align: center; font: 700 22px/1.4 var(--pix); color: #3a1d0a; position: relative; text-wrap: balance; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; }
.facts div { background: rgba(110,58,18,.1); box-shadow: inset 0 0 0 2px rgba(110,58,18,.35); padding: 8px; text-align: center; display: flex; flex-direction: column; }
.facts b { font: 700 22px var(--pix); color: var(--ink); font-variant-numeric: tabular-nums; }
.facts span { font-size: 13px; color: var(--ink-soft); }
.pals { display: grid; gap: 8px; position: relative; }
.pals div { display: flex; align-items: center; gap: 10px; }
.pals img { flex: none; width: 40px; height: auto; }
.pals span { display: flex; flex-direction: column; color: #3a1d0a; font-size: 15px; line-height: 1.4; }
.pals small { font: 700 11px var(--pix); color: var(--ink-soft); }
.save { display: flex; flex-direction: column; gap: 10px; }
.save img { width: 100%; box-shadow: 0 0 0 3px var(--edge); }

/* 게임 소개 */
.game { display: flex; flex-direction: column; gap: 16px; }
.game h3 { font-family: var(--pix); font-weight: 700; font-size: 22px; line-height: 1.5; margin: 0; }
.game p { margin: 0; }
.game ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.trailer { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--edge); border: 0; padding: 0; cursor: pointer; box-shadow: 0 0 0 4px var(--edge), 0 0 0 8px var(--gold); margin: 8px; width: calc(100% - 16px); }
.trailer iframe { width: 100%; height: 100%; border: 0; display: block; }
.yt { align-self: flex-end; color: var(--mute); font: 400 11px var(--pix); text-decoration: none; }
.yt:hover, .yt:focus-visible { color: var(--cream); }
.trailer iframe { width: 100%; height: 100%; border: 0; display: block; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.shots img { width: 100%; height: auto; box-shadow: 0 0 0 3px var(--edge); }
.stores { display: flex; flex-wrap: wrap; gap: 12px; }
.stores a { flex: 1 1 200px; text-align: center; text-decoration: none; background: var(--cream); color: var(--edge); padding: 13px 14px; font: 700 11px var(--pix); box-shadow: inset 0 -5px 0 #cbbf9c, 0 0 0 3px var(--edge); margin: 3px; }
.stores a:hover, .stores a:focus-visible { background: #fff; outline: 0; }
.foot { font-size: 12px; color: var(--mute); }

@media (prefers-reduced-motion: no-preference) {
  .enter { animation: up .3s steps(3) both; }
  @keyframes up { from { transform: translateY(6px); } }
}

  <main id="app"><section class="hero panel"><h1>옛날에 태어났다면<br><em>나를 잡아갈 요괴</em>는?</h1>
    <p>열 가지 질문에 답하면, 옛이야기 속 요괴 하나가 당신을 노리는 이유를 알려 줍니다. 저승사자, 구미호, 창귀, 물귀신, 도깨비 대왕, 지하국 대적, 여우 누이, 장산범, 그슨대, 이무기, 역신, 달걀귀신 가운데 누가 당신을 찾아올까요? 한국 설화로 만든 게임 '설화던전'의 요괴 테스트입니다.</p></section></main>

// 언어: 주소의 ?lang= > 저장한 선택 > 브라우저 언어(ko·ja로 시작하면 그 말, 나머지는 영어). 주소로 고른 말은 저장도 한다
const LANGS = ["ko", "en", "ja"];
let lang = (() => { const n = (navigator.language || "").toLowerCase(); return n.startsWith("ko") ? "ko" : n.startsWith("ja") ? "ja" : "en"; })();
{
  let q = null, s = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  try { s = localStorage.getItem("yk_lang"); } catch (e) {}
  if (LANGS.includes(q)) { lang = q; try { localStorage.setItem("yk_lang", q); } catch (e) {} }
  else if (LANGS.includes(s)) lang = s;
}
let step = -1, picks = [], result = null, friend = false, friendRes = null, nick = "", revealing = false;
// 숫자만 센다(방문·시작·결과·공유). 공개 주소에서만 — 미리보기·내 컴퓨터는 안 센다. 칸 이름은 tools/yokai_counters.py KEYS와 같아야 한다
function ping(ev) {
  if (!/(github\.io|seolhwadungeon\.com)$/.test(location.hostname) || !D.fs) return;
  try {
    const base = `projects/${D.fs.project}/databases/(default)/documents`;
    fetch(`https://firestore.googleapis.com/v1/${base}:commit?key=${D.fs.key}`, { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ writes: [{ transform: { document: `${base}/yokai/s${Math.floor(Math.random() * 10)}`, fieldTransforms: [{ fieldPath: ev, increment: { integerValue: "1" } }] } }] }) }).catch(() => {});
  } catch (e) {}
}
function pingOnce(ev) { try { if (sessionStorage.getItem("yk_" + ev)) return; sessionStorage.setItem("yk_" + ev, "1"); } catch (e) {} ping(ev); }
{ const h = (location.hash || "").slice(1); if (D.r[h]) { result = h; friend = true; friendRes = h; } }

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function px(r, scale) { return `width="${Math.round(r.w * scale)}" height="${Math.round(r.h * scale)}"`; }

function showQuestion() {

function score() {
  const s = {}, firsts = {};
  Object.keys(D.r).forEach((k) => { s[k] = 0; firsts[k] = 0; });
  picks.forEach((i, qi) => { const p = D.q[qi].a[i].p; for (const k in p) { s[k] += p[k]; if (p[k] === 2) firsts[k]++; } });
  return Object.keys(s).sort((a, b) => (s[b] - s[a]) || (firsts[b] - firsts[a]) || (picks.reduce((x, y) => x + y, 0) % 2 ? a.localeCompare(b) : b.localeCompare(a)))[0];
}

// 일본어는 띄어쓰기가 없어 글자마다 꺾되, 、。」 같은 닫는 부호와 작은 가나는 앞 글자에, 「 같은 여는 부호는 뒤 글자에 붙인다
function tokens(text) {
  if (lang !== "ja") return text.split(/(?<= )/);
  const out = [];
  for (const ch of text) {
    const last = out.length ? out[out.length - 1] : "";
    if (last && (/[、。，．・ー」』）！？…ぁぃぅぇぉっゃゅょァィゥェォッャュョ]/.test(ch) || /[「『（]$/.test(last))) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}
// 카드 글꼴: 일본어는 갈무리 일본어 판과 일본어 시스템 글꼴(한글 글꼴의 한국식 한자 모양을 피한다)
const PIX = () => lang === "ja" ? "GalmuriJA, Galmuri, 'Hiragino Sans', sans-serif" : "Galmuri, sans-serif";
const BODY = () => lang === "ja" ? "'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" : "'Gowun Dodum', sans-serif";

function wrap(ctx, text, x, y, maxW, lh, maxLines) {
  const words = tokens(text);
  let line = "", n = 0, cut = false;
  for (const w of words) {
    const test = line + w;
    if (ctx.measureText(test).width > maxW && line) {
      // 마지막 줄이 넘치면 거기서 끊고 … (예전에는 남은 글을 버리고 낱말 하나만 그렸다)
      if (n >= maxLines - 1) { cut = true; break; }
      ctx.fillText(line.trim(), x, y); y += lh; line = w; n++;
    }
    else line = test;
  }
  if (cut) { line = line.trim(); while (line && ctx.measureText(line + "…").width > maxW) line = line.slice(0, -1); line = line.replace(/[\s、。,.]+$/, "") + "…"; }
  if (line) { ctx.fillText(line.trim(), x, y); y += lh; }
  return y;
}

async function drawCard(r, c) {
  try { await Promise.all(["700 44px Galmuri", "33px Galmuri", "34px 'Gowun Dodum'"].concat(lang === "ja" ? ["700 44px GalmuriJA", "33px GalmuriJA"] : []).map((f) => document.fonts.load(f, lang === "ja" ? "あ妖" : undefined))); } catch (e) {}
  // 인스타 스토리 크기. 위아래 250px쯤은 스토리 화면 글자에 덮이니 주소는 그 안쪽에 둔다
  const W = 1080, H = 1920, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = "#2b5848"; x.fillRect(0, 0, W, H);
  const band = new Image(); band.src = D.band; await band.decode().catch(() => {});
  x.imageSmoothingEnabled = false;
  for (let bx = 0; bx < W; bx += band.width * 4) { x.drawImage(band, bx, 0, band.width * 4, band.height * 4); x.drawImage(band, bx, H - band.height * 4, band.width * 4, band.height * 4); }
  x.textAlign = "center"; x.fillStyle = "#f7f0dc"; x.font = "33px " + PIX();
  wrap(x, t().cardTop, W / 2, 300, 900, 48, 2);
  // 부적 = 저승 명부 한 장
  const px0 = 70, py0 = 380, pw = W - 140, ph = 1060;
  x.fillStyle = "#160d0a"; x.fillRect(px0 - 6, py0 - 6, pw + 12, ph + 12);
  x.fillStyle = "#ecc458"; x.fillRect(px0, py0, pw, ph);
  x.strokeStyle = "#9e2219"; x.lineWidth = 5; x.strokeRect(px0 + 22, py0 + 22, pw - 44, ph - 44);
  x.fillStyle = "#6e3a12"; x.font = "33px " + PIX(); x.fillText(t().ledger(nick), W / 2, py0 + 85);
  const img = new Image(); img.src = r.img; await img.decode().catch(() => {});
  const k = Math.max(1, Math.floor(Math.min(480 / img.width, 360 / img.height) * 4) / 4);
  const iw = img.width * k, ih = img.height * k;
  x.imageSmoothingEnabled = false;
  x.drawImage(img, (W - iw) / 2, py0 + 120 + (360 - ih), iw, ih);
  x.fillStyle = "#9e2219"; x.font = "700 66px " + PIX();
  let y = wrap(x, c.name, W / 2, py0 + 580, pw - 120, 78, 2);
  x.fillStyle = "#3a1d0a"; x.font = "700 44px " + PIX();
  y = wrap(x, t().cause + t().sep + c.cause, W / 2, y + 20, pw - 120, 58, 2);
  // 이유 글은 아래 생존 확률 칸(py0 + ph - 190부터) 위에서 끝나게 — 일본어는 띄어쓰기가 없어 줄이 길어 조금 작게
  const wf = lang === "ja" ? 28 : 32, wl = lang === "ja" ? 42 : 48;
  x.fillStyle = "#3a1d0a"; x.font = wf + "px " + BODY();
  // 이름·사인이 길어(영어) 자리가 없으면 이유는 빼고(페이지에는 있다) 칸과 겹치지 않게 한다
  const wn = Math.min(3, Math.floor((py0 + ph - 194 - (y + 30)) / wl) + 1);
  if (wn > 0) y = wrap(x, c.why, W / 2, y + 30, pw - 150, wl, wn);
  // 생존 확률 · 구해 줄 친구 — 친구를 부르는 줄
  const sy = py0 + ph - 150;
  x.fillStyle = "rgba(110,58,18,.12)"; x.fillRect(px0 + 50, sy - 40, pw - 100, 120);
  x.fillStyle = "#9e2219"; x.font = "700 33px " + PIX();
  x.fillText(`${t().livePct} ${r.live_pct}%`, W / 2, sy + 2);
  x.fillStyle = "#3a1d0a"; x.font = "30px " + BODY();
  x.fillText(t().cardSave + (lang === "ja" ? "" : " ") + t().palOf(D.r[r.saver][lang].name), W / 2, sy + 52);
  // 테스트 이름과 주소 — 그림만 돌아다녀도 찾아올 수 있게
  const host = (D.base || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
  x.fillStyle = "#f7f0dc"; x.font = "700 44px " + PIX(); x.fillText(t().cardTest, W / 2, 1530);
  x.fillStyle = "#160d0a"; x.fillRect(W / 2 - 400, 1565, 800, 92);
  x.fillStyle = "#ecc458"; x.fillRect(W / 2 - 394, 1571, 788, 80);
  x.fillStyle = "#2a1a05"; x.font = "700 44px " + PIX(); x.fillText(host, W / 2, 1626);
  x.fillStyle = "#f7f0dc"; x.font = "33px " + PIX(); x.fillText(t().cardTry, W / 2, 1712);
  return cv.toDataURL("image/png");
}

document.querySelectorAll("#langs .lang").forEach((b) => b.onclick = () => {
  if (b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem("yk_lang", lang); } catch (e) {}
  // 주소에 ?lang=이 있으면 고른 말로 바꿔 둔다(새로 고쳐도 그 말로)
  try { const u = new URL(location.href); if (u.searchParams.has("lang")) { u.searchParams.set("lang", lang); history.replaceState(null, "", u); } } catch (e) {}
  render();
});
render();
</script>
