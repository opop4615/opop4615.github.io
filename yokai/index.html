:root {
  --green: #2b5848;
  --green-2: #234a3c;
  --lac: #35201a;
  --lac-2: #4a2c22;
  --edge: #160d0a;
  --gold: #e0ad48;
  --cream: #f7f0dc;
  --mute: #b9d1c4;
  --paper: #ecc458;
  --ink: #9e2219;
  --ink-soft: #6e3a12;
  --pix: "Galmuri", "Gowun Dodum", monospace;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--green); color: var(--cream); }
body { font-family: var(--body); font-size: 16px; line-height: 1.7; margin: 0; }
.band { height: 63px; background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAVCAYAAABc6S4mAAAAa0lEQVR4nGPk4+L7z0BDwERLw+liAWPShmmjQYQXsJw5cYkkDRvuINQHqOgRVD/0g4hRryKDYCqq2bKHoEEtPi5w9jqje3D2CAkiZGA0Zw2cfS4lhKD6oR9ELKRqICZYkMHQDyLG0RqNEAAAlKMX32X2oloAAAAASUVORK5CYII=) repeat-x 0 0 / 72px 63px; image-rendering: pixelated; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 18px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.top b { font-family: var(--pix); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.lang { background: var(--lac); border: 0; box-shadow: 0 0 0 2px var(--edge), 0 0 0 4px var(--gold); color: var(--cream); padding: 4px 12px; font: 400 11px var(--pix); cursor: pointer; margin-right: 4px; }
button { font-family: var(--body); }
:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
img.px { image-rendering: pixelated; }

/* 판: 옻칠 바탕에 검은 테 + 금테, 둥근 모서리·번지는 그림자 없음 */
.panel { background: var(--lac); box-shadow: 0 0 0 4px var(--edge), 0 0 0 8px var(--gold), 8px 8px 0 8px rgba(22,13,10,.35); margin: 8px; padding: 22px 18px; }

/* 시작 */
.hero { display: flex; flex-direction: column; gap: 16px; }
.hero h1 { font-family: var(--pix); font-weight: 700; font-size: 33px; line-height: 1.35; margin: 0; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--paper); }
.hero p { margin: 0; color: var(--mute); max-width: 36ch; }
.lineup { display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 6px 0 0; border-bottom: 4px solid var(--edge); overflow: hidden; }
.lineup img { flex: none; }
.go { align-self: stretch; background: var(--paper); color: #2a1a05; border: 0; padding: 16px 20px; font: 700 22px var(--pix); cursor: pointer; box-shadow: inset 0 -6px 0 #b8862c, 0 0 0 4px var(--edge); margin: 4px; }
.go:active { box-shadow: inset 0 -2px 0 #b8862c, 0 0 0 4px var(--edge); transform: translateY(2px); }
.small { font: 400 11px var(--pix); color: var(--mute); letter-spacing: .02em; }

/* 질문 */
.q { display: flex; flex-direction: column; gap: 18px; }
.prog { display: flex; align-items: center; gap: 12px; font: 400 11px var(--pix); color: var(--mute); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--edge); }
.bar i { display: block; height: 100%; background: var(--paper); transition: width .25s steps(4); }
.q h2 { font-family: var(--pix); font-weight: 700; font-size: 22px; line-height: 1.5; margin: 0; }
.opts { display: grid; gap: 12px; }
.opt { text-align: left; background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 14px 16px; font-size: 16px; cursor: pointer; margin: 3px; }
.opt:hover, .opt:focus-visible { box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--gold); outline: 0; }
.back { align-self: flex-start; background: none; border: 0; color: var(--mute); font: 400 11px var(--pix); cursor: pointer; padding: 4px 0; }

/* 결과: 괴황지 부적 */
.lead { font: 400 11px var(--pix); color: var(--mute); margin: 0; }
.charm { position: relative; background: var(--paper); color: var(--ink); padding: 26px 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 4px var(--edge), 8px 8px 0 4px rgba(22,13,10,.35); margin: 4px; }
.charm::before { content: ""; position: absolute; inset: 10px; border: 3px solid var(--ink); pointer-events: none; }
.charm .who { display: flex; align-items: flex-end; justify-content: center; min-height: 190px; padding-top: 8px; }
.charm .who img { max-width: 100%; height: auto; }

.stamp { position: absolute; top: 22px; right: 20px; width: 70px; height: 70px; border: 4px solid var(--ink); color: var(--ink); font: 700 11px/1.5 var(--pix); display: grid; place-items: center; text-align: center; transform: rotate(8deg); }
.charm dl { margin: 0; display: grid; gap: 12px; position: relative; }
.charm dt { font: 700 11px var(--pix); letter-spacing: .04em; color: var(--ink-soft); }
.charm dd { margin: 2px 0 0; color: #3a1d0a; font-size: 15.5px; }
.charm .god { display: flex; align-items: center; gap: 10px; }
.charm .god img { flex: none; }

.row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 11px 16px; font: 400 11px var(--pix); cursor: pointer; margin: 3px; }
.btn:hover, .btn:focus-visible { box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--gold); outline: 0; }
.btn.main { width: calc(100% - 8px); margin: 4px; background: var(--paper); color: #2a1a05; font: 700 22px var(--pix); padding: 16px; box-shadow: inset 0 -6px 0 #b8862c, 0 0 0 4px var(--edge); }
.sh { background: var(--lac-2); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 8px 14px; font: 400 11px var(--pix); cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 3px; }
.ic.kakao { background: #fee500; color: #191919; width: 26px; height: 26px; display: grid; place-items: center; font-weight: 900; }
.friend { background: var(--lac); box-shadow: 0 0 0 3px var(--edge); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin: 3px; }
.note { min-height: 1.4em; font-size: 13px; color: var(--paper); margin: 0; }
.copybox { width: 100%; box-sizing: border-box; background: var(--lac); color: var(--cream); border: 0; box-shadow: 0 0 0 3px var(--edge); padding: 10px; font: 13px/1.5 var(--body); }
.save { display: flex; flex-direction: column; gap: 10px; }
.save img { width: 100%; box-shadow: 0 0 0 3px var(--edge); }

/* 게임 소개 */
.game { display: flex; flex-direction: column; gap: 16px; }
.game h3 { font-family: var(--pix); font-weight: 700; font-size: 22px; line-height: 1.5; margin: 0; }
.game p { margin: 0; }
.game ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.trailer { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--edge); border: 0; padding: 0; cursor: pointer; box-shadow: 0 0 0 4px var(--edge), 0 0 0 8px var(--gold); margin: 8px; width: calc(100% - 16px); }
.trailer iframe { width: 100%; height: 100%; border: 0; display: block; }
.yt { align-self: flex-end; color: var(--mute); font: 400 11px var(--pix); text-decoration: none; }
.yt:hover, .yt:focus-visible { color: var(--cream); }
.trailer iframe { width: 100%; height: 100%; border: 0; display: block; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.shots img { width: 100%; height: auto; box-shadow: 0 0 0 3px var(--edge); }
.stores { display: flex; flex-wrap: wrap; gap: 12px; }
.stores a { flex: 1 1 200px; text-align: center; text-decoration: none; background: var(--cream); color: var(--edge); padding: 13px 14px; font: 700 11px var(--pix); box-shadow: inset 0 -5px 0 #cbbf9c, 0 0 0 3px var(--edge); margin: 3px; }
.stores a:hover, .stores a:focus-visible { background: #fff; outline: 0; }
.foot { font-size: 12px; color: var(--mute); }

@media (prefers-reduced-motion: no-preference) {
  .enter { animation: up .3s steps(3) both; }
  @keyframes up { from { transform: translateY(6px); } }
}

    <div class="lineup" aria-hidden="true">${ids.map((k) => `<img class="px" src="${D.r[k].img}" alt="" ${px(D.r[k], 0.5)}>`).join("")}</div>
  </section>
  <button class="go" id="go" type="button">${esc(t().start)}</button>
  <span class="small">${esc(t().time)}</span>`;
  document.getElementById("go").onclick = () => { ping("start"); step = 0; picks = []; render(); };
}

function showQuestion() {
  const q = D.q[step];
  app.innerHTML = `<section class="q panel enter">
    <div class="prog"><span>${step + 1} / ${D.q.length}</span><div class="bar"><i style="width:${(step / D.q.length) * 100}%"></i></div></div>
    <h2>${esc(q[lang])}</h2>
    <div class="opts">${q.a.map((a, i) => `<button class="opt" type="button" data-i="${i}">${esc(a[lang])}</button>`).join("")}</div>
    ${step > 0 ? `<button class="back" id="back" type="button">${esc(t().back)}</button>` : ""}
  </section>`;
  app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
    picks[step] = +b.dataset.i;
    if (step + 1 < D.q.length) { step++; render(); } else { result = score(); ping("r_" + result); render(); window.scrollTo(0, 0); }
  });
  const bk = document.getElementById("back");
  if (bk) bk.onclick = () => { step--; render(); };
}

function score() {
  const s = {}, firsts = {};
  Object.keys(D.r).forEach((k) => { s[k] = 0; firsts[k] = 0; });
  picks.forEach((i, qi) => { const p = D.q[qi].a[i].p; for (const k in p) { s[k] += p[k]; if (p[k] === 2) firsts[k]++; } });
  return Object.keys(s).sort((a, b) => (s[b] - s[a]) || (firsts[b] - firsts[a]) || (picks.reduce((x, y) => x + y, 0) % 2 ? a.localeCompare(b) : b.localeCompare(a)))[0];
}

function showResult() {
  const r = D.r[result], c = r[lang];
  const scale = Math.min(1.3, 260 / r.w, 230 / r.h);
  app.innerHTML = `<section class="enter" style="display:flex;flex-direction:column;gap:20px">
    <p class="lead">${esc(friend ? t().friendLead : t().lead)}</p>
    <article class="charm">
      <div class="stamp" aria-hidden="true">${t().stamp}</div>
      <div class="who"><img class="px" src="${r.img}" alt="${esc(c.name)}" ${px(r, scale)}></div>
      <h2>${esc(c.name)}</h2>
      <dl>
        <div><dt>${esc(t().why)}</dt><dd>${esc(c.why)}</dd></div>
        <div><dt>${esc(t().tale)}</dt><dd>${esc(c.tale)}</dd></div>
        <div><dt>${esc(t().live)}</dt><dd>${esc(c.live)}</dd></div>
        <div><dt>${esc(t().god)}</dt><dd class="god"><img class="px" src="${r.god_img}" alt="" ${px({ w: r.gw, h: r.gh }, 0.4)}><span>${esc(c.god)}</span></dd></div>
      </dl>
    </article>
    ${friend ? `<div class="friend"><span>${esc(t().friendLead)}</span><button class="btn main" id="mine" type="button">${esc(t().mine)}</button></div>` : ""}
    <button class="btn main" id="withimg" type="button">${esc(t().withImg)}</button>
    <div class="row"><button class="btn" id="again" type="button">${esc(t().again)}</button></div>
    <p class="note" id="note" role="status"></p>
    <textarea class="copybox" id="copybox" rows="3" readonly hidden></textarea>
    <div class="save">
      <span class="small">${esc(t().card)} · ${esc(t().cardHint)}</span>
      <img id="cardimg" alt="${esc(c.name)}">
    </div>
    <div class="band" aria-hidden="true" style="margin-inline:-18px"></div>
    <section class="game">
      <h3>${esc(t().ctaH(c.name))}</h3>
      <div class="trailer"><iframe src="https://www.youtube-nocookie.com/embed/${D.yt[lang]}?rel=0&playsinline=1" title="${esc(t().watch)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
      <p>${esc(t().about)}</p>
      <ul>${t().points.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="stores"><a href="${D.play}" target="_blank" rel="noopener">${esc(t().play)}</a><a href="${D.ios}" target="_blank" rel="noopener">${esc(t().ios)}</a></div>
    </section>
  </section>`;
  const url = (D.base || location.href.split("#")[0]) + "r/" + result + "/";
  const msg = t().shareText(c.name);
  const note = (s) => { document.getElementById("note").textContent = s; };
  const fallback = () => { const b = document.getElementById("copybox"); b.hidden = false; b.value = msg + "\n" + url; b.focus(); b.select(); note(t().copyFail); };
  const copyLink = async () => { try { await navigator.clipboard.writeText(msg + "\n" + url); note(t().copied); } catch (e) { fallback(); } };
  const sheet = async (extra) => {
    if (navigator.share) { try { await navigator.share(Object.assign({ title: t().cardTop, text: msg, url }, extra || {})); note(t().shared); return true; } catch (e) { if (e && e.name === "AbortError") return true; } }
    return false;
  };
  const open = (u) => { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); };
  const E = encodeURIComponent;
  const act = {
    kakao: async () => {
      if (window.Kakao && Kakao.isInitialized && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({ objectType: "feed", content: { title: t().cardTop + " " + c.name, description: c.why, imageUrl: D.base + "og/" + result + ".png", link: { mobileWebUrl: url, webUrl: url } },
          buttons: [{ title: t().mine, link: { mobileWebUrl: D.base, webUrl: D.base } }] });
        return;
      }
      note(t().kakaoNo); if (!(await sheet())) await copyLink();
    },
    insta: async () => {
      const im = document.getElementById("cardimg");
      try {
        const blob = await (await fetch(im.src)).blob();
        const file = new File([blob], "yokai-" + result + ".png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      note(t().instaHint); im.scrollIntoView({ behavior: "smooth", block: "center" });
    },
    x: () => open("https://twitter.com/intent/tweet?text=" + E(msg) + "&url=" + E(url)),
    fb: () => open("https://www.facebook.com/sharer/sharer.php?u=" + E(url)),
    threads: () => open("https://www.threads.net/intent/post?text=" + E(msg + " " + url)),
    link: copyLink,
  };
  const cardFile = async () => {
    const im = document.getElementById("cardimg");
    if (!im || !im.src) return null;
    const blob = await (await fetch(im.src)).blob();
    return new File([blob], "yokai-" + result + ".png", { type: "image/png" });
  };
  const cardReady = drawCard(r, c).then((src) => { const im = document.getElementById("cardimg"); if (im) im.src = src; }).catch(() => {});
  let file = null;
  cardReady.then(async () => { try { file = await cardFile(); } catch (e) {} });
  document.getElementById("withimg").onclick = () => {
    ping("share");
    // 스토리에 그림만 올라가도 찾아올 수 있게, 공유 창을 열기 전에 링크를 복사해 둔다 (인스타 링크 스티커에 붙여 넣기)
    let copied = false;
    try { navigator.clipboard.writeText(url).then(() => { copied = true; }, () => {}); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      // 링크를 따로 주면 그림을 버리는 앱이 있어 글 안에 주소를 넣는다
      navigator.share({ files: [file], text: msg + "\n" + url }).then(() => note(t().sticker), (e) => { if (!(e && e.name === "AbortError")) note(t().sticker); });
      note(t().sticker);
      return;
    }
    if (navigator.share) { navigator.share({ title: t().cardTop, text: msg, url }).then(() => note(t().sticker), () => {}); note(t().sticker); return; }
    setTimeout(() => copied ? note(t().withImgNo) : fallback(), 300);
  };
  app.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { ping(b.dataset.s === "kakao" ? "kakao" : "copy"); act[b.dataset.s](); });
  app.querySelectorAll(".stores a").forEach((a, i) => a.addEventListener("click", () => ping(i ? "ios" : "play")));
  const tv = app.querySelector(".trailer");
  if (tv && "IntersectionObserver" in window) { const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { pingOnce("trailer"); io.disconnect(); } }, { threshold: 0.6 }); io.observe(tv); }
  const mine = document.getElementById("mine");
  if (mine) mine.onclick = () => { friend = false; result = null; step = -1; picks = []; history.replaceState(null, "", location.pathname); render(); window.scrollTo(0, 0); };
  document.getElementById("again").onclick = () => { friend = false; result = null; step = -1; picks = []; render(); window.scrollTo(0, 0); };
}

function wrap(ctx, text, x, y, maxW, lh, maxLines) {
  const words = lang === "ko" ? text.split(/(?<= )/) : text.split(/(?<= )/);
  let line = "", n = 0;
  for (const w of words) {
    const test = line + w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line.trim(), x, y); y += lh; line = w; if (++n >= maxLines - 1) break; }
    else line = test;
  }
  if (line) { ctx.fillText(line.trim(), x, y); y += lh; }
  return y;
}

async function drawCard(r, c) {
  try { await Promise.all(["700 44px Galmuri", "33px Galmuri", "34px 'Gowun Dodum'"].map((f) => document.fonts.load(f))); } catch (e) {}
  // 인스타 스토리 크기. 위아래 250px쯤은 스토리 화면 글자에 덮이니 주소는 그 안쪽에 둔다
  const W = 1080, H = 1920, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = "#2b5848"; x.fillRect(0, 0, W, H);
  const band = new Image(); band.src = D.band; await band.decode().catch(() => {});
  x.imageSmoothingEnabled = false;
  for (let bx = 0; bx < W; bx += band.width * 4) { x.drawImage(band, bx, 0, band.width * 4, band.height * 4); x.drawImage(band, bx, H - band.height * 4, band.width * 4, band.height * 4); }
  x.textAlign = "center"; x.fillStyle = "#f7f0dc"; x.font = "33px Galmuri, sans-serif";
  wrap(x, t().cardTop, W / 2, 300, 900, 48, 2);
  // 부적
  const px0 = 70, py0 = 380, pw = W - 140, ph = 1060;
  x.fillStyle = "#160d0a"; x.fillRect(px0 - 6, py0 - 6, pw + 12, ph + 12);
  x.fillStyle = "#ecc458"; x.fillRect(px0, py0, pw, ph);
  x.strokeStyle = "#9e2219"; x.lineWidth = 5; x.strokeRect(px0 + 22, py0 + 22, pw - 44, ph - 44);
  const img = new Image(); img.src = r.img; await img.decode().catch(() => {});
  const k = Math.max(1, Math.floor(Math.min(520 / img.width, 440 / img.height) * 4) / 4);
  const iw = img.width * k, ih = img.height * k;
  x.imageSmoothingEnabled = false;
  x.drawImage(img, (W - iw) / 2, py0 + 60 + (440 - ih), iw, ih);
  x.textAlign = "center"; x.fillStyle = "#9e2219"; x.font = "700 66px Galmuri, sans-serif";
  let y = wrap(x, c.name, W / 2, py0 + 600, pw - 120, 78, 2);
  x.fillStyle = "#3a1d0a"; x.font = "34px 'Gowun Dodum', sans-serif";
  y = wrap(x, c.why, W / 2, y + 30, pw - 140, 50, 4);
  x.fillStyle = "#6e3a12"; x.font = "30px 'Gowun Dodum', sans-serif";
  wrap(x, t().live + " · " + c.live, W / 2, Math.min(y + 30, py0 + ph - 150), pw - 140, 44, 3);
  // 테스트 이름과 주소 — 그림만 돌아다녀도 찾아올 수 있게
  const host = (D.base || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
  x.fillStyle = "#f7f0dc"; x.font = "700 44px Galmuri, sans-serif"; x.fillText(t().cardTest, W / 2, 1530);
  x.fillStyle = "#160d0a"; x.fillRect(W / 2 - 400, 1565, 800, 92);
  x.fillStyle = "#ecc458"; x.fillRect(W / 2 - 394, 1571, 788, 80);
  x.fillStyle = "#2a1a05"; x.font = "700 44px Galmuri, sans-serif"; x.fillText(host, W / 2, 1626);
  x.fillStyle = "#f7f0dc"; x.font = "33px Galmuri, sans-serif"; x.fillText(t().cardTry, W / 2, 1712);
  return cv.toDataURL("image/png");
}

document.getElementById("lang").onclick = () => { lang = lang === "ko" ? "en" : "ko"; try { localStorage.setItem("yk_lang", lang); } catch (e) {} render(); };
render();
</script>
